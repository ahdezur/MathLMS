services:
  - type: web
    name: mathlms
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx prisma db seed && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mathlms-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: mathlms-db
    databaseName: mathlms
    user: mathlms_user
    plan: free
